; Entspricht den Anforderungen + etwas Puffer
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120
max_input_vars = 5000

; Sessions via Cookies
session.use_cookies = 1
session.cookie_httponly = 1

; cURL, JSON etc. sind in der Base bereits aktiv
; Optional sinnvoll:
; date.timezone = Europe/Berlin
